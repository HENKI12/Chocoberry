<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Keranjang - Chocoberry
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo">

            <img
                src="img/logo.jpeg"
                alt="Logo Chocoberry">

            <div class="logo-text">

                <h2>
                    Chocoberry
                </h2>

                <span>
                    Sweet & Delicious
                </span>

            </div>

        </a>


        <nav>

            <a href="index.html">
                Menu
            </a>

            <a
                href="keranjang.html"
                class="cart-link active">

                <span class="cart-icon">
                    🛒
                </span>

                <span class="cart-text">
                    Keranjang
                </span>

                <b id="cart-count">
                    0
                </b>

            </a>

        </nav>

    </header>


    <!-- ================= CART ================= -->

    <main class="page-container">

        <div class="page-heading">

            <span>
                SHOPPING CART
            </span>

            <h1>
                Keranjang Saya
            </h1>

            <p>
                Pilih produk yang ingin kamu beli.
            </p>

        </div>


        <div id="cart-container">

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">

            <img
                src="img/logo.jpeg"
                alt="Chocoberry">

            <strong>
                Chocoberry
            </strong>

        </div>

        <p>
            Sweet & Delicious
        </p>

        <small>
            © 2026 Chocoberry. All Rights Reserved.
        </small>

    </footer>


    <script src="script.js"></script>

</body>

</html>
